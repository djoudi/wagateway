services:

  # ============================================================
  # Laravel PHP-FPM Application
  # ============================================================
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wa-service:
        condition: service_healthy

    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      # Laravel
      APP_URL: ${APP_URL}

      # PostgreSQL
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # WhatsApp service
      WA_SERVICE_URL: http://wa-service:3000
      WA_SERVICE_SECRET: ${WA_SERVICE_SECRET}

    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs

    networks:
      - wg_net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php-fpm -t"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s


  # ============================================================
  # Nginx
  # ============================================================
  nginx:
    image: nginx:1.27-alpine

    restart: unless-stopped

    expose:
      - "80"

    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.easypanel.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage/app:ro

    depends_on:
      app:
        condition: service_healthy

    networks:
      - wg_net


  # ============================================================
  # WhatsApp Service
  # ============================================================
  wa-service:
    build:
      context: ./wa-service
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      PORT: "3000"

      LARAVEL_WEBHOOK_URL: http://app/internal/wa-events

      LARAVEL_SECRET: ${WA_SERVICE_SECRET}

      SESSION_STORE: local

      LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:
      - wa_sessions:/app/sessions
      - wa_logs:/app/src/logs

    networks:
      - wg_net

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health',{headers:{'x-wg-secret':process.env.LARAVEL_SECRET}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s


  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"

    volumes:
      - pg_data:/var/lib/postgresql/data

    networks:
      - wg_net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine

    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "60 1000"
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    networks:
      - wg_net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}


  # ============================================================
  # Laravel Horizon
  # ============================================================
  horizon:
    build:
      context: .
      dockerfile: docker/Dockerfile.app

    restart: unless-stopped

    command:
      - php
      - artisan
      - horizon

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      # PostgreSQL
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # WhatsApp
      WA_SERVICE_URL: http://wa-service:3000
      WA_SERVICE_SECRET: ${WA_SERVICE_SECRET}

    volumes:
      - app_logs:/var/www/html/storage/logs

    networks:
      - wg_net


  # ============================================================
  # Laravel Reverb
  # ============================================================
  reverb:
    build:
      context: .
      dockerfile: docker/Dockerfile.app

    restart: unless-stopped

    command:
      - php
      - artisan
      - reverb:start
      - --host=0.0.0.0
      - --port=8080

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      # PostgreSQL
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Reverb
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: "8080"

    networks:
      - wg_net


  # ============================================================
  # Laravel Scheduler
  # ============================================================
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.app

    restart: unless-stopped

    command:
      - php
      - artisan
      - schedule:work

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      # PostgreSQL
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    networks:
      - wg_net


# ==============================================================
# Volumes
# ==============================================================
volumes:

  pg_data:
    driver: local

  redis_data:
    driver: local

  wa_sessions:
    driver: local

  wa_logs:
    driver: local

  app_storage:
    driver: local

  app_logs:
    driver: local


# ==============================================================
# Network
# ==============================================================
networks:

  wg_net:
    driver: bridge
