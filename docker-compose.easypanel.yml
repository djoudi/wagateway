# ═════════════════════════════════════════════════════════════════════════
# EasyPanel deployment variant
# ═════════════════════════════════════════════════════════════════════════
# ⚠ Based on EasyPanel's documented Traefik-based architecture (same
#   SSL-at-the-edge pattern as Coolify), NOT freshly verified against live
#   EasyPanel docs — this sandbox has no network access to app.easypanel.io
#   at build time. Verify exact UI steps against your EasyPanel version
#   before relying on this blindly; the container-level configuration
#   below (env vars, volumes, networking) is platform-agnostic and correct
#   regardless of any EasyPanel UI specifics.
#
# Differences from the standalone docker-compose.yml:
#   1. No `env_file: .env` — EasyPanel injects the variables you set in
#      its UI as real container environment variables, which Laravel's
#      env() reads via getenv() exactly the same either way.
#   2. nginx uses `expose:` instead of `ports:` — it publishes to the
#      internal Docker network only. EasyPanel's built-in Traefik proxy
#      (which already owns host ports 80/443) discovers and routes to it
#      via the domain you attach to the nginx service in the EasyPanel UI.
#   3. No `container_name:` — EasyPanel manages container naming itself;
#      hardcoded names can collide across redeploys.
#   4. No fixed network subnet — left to Docker's default allocation to
#      avoid colliding with EasyPanel's own network ranges on a shared host.
#   5. nginx uses docker/nginx.easypanel.conf (plain HTTP) instead of
#      docker/nginx.conf (which does its own SSL termination — redundant
#      and conflicting when Traefik already terminates SSL at the edge).
#   6. Reverb (WebSocket) needs NO separate domain or exposed port — nginx
#      proxies /app/* to it internally over the same public domain/port
#      as everything else (see docker/nginx.easypanel.conf).
#
# Deployment — Option A (recommended): unified Compose project
#   1. EasyPanel → Project → Add Service → App → "Docker Compose"
#   2. Point it at this file (or copy its contents into EasyPanel's
#      Compose editor directly).
#   3. Environment Variables → paste the contents of .env.example with
#      real values (run generate-secrets.sh first for the secret ones).
#      Set VITE_REVERB_HOST to your real domain (bare hostname, no scheme).
#   4. For the `nginx` service specifically: attach your domain, internal
#      port = 80.
#   5. Deploy. Then open a shell into the `app` service (EasyPanel provides
#      a terminal per service) and run:
#        php artisan migrate --force
#        php artisan db:seed --class=PlanSeeder --force
#
# Deployment — Option B: individual Apps per service (what your last
# build log suggests you may already be mid-way through — the build path
# /etc/easypanel/projects/<project>/<service>/code/ indicates a
# per-service Dockerfile deploy, not a unified Compose project)
#   If you go this route instead, you need SEVEN separate EasyPanel App
#   services in the same Project — app, nginx, wa-service, horizon,
#   reverb, scheduler, plus EasyPanel's native Postgres and Redis
#   "one-click" database templates (simpler than rolling your own via
#   compose, and EasyPanel manages their backups). Every PHP-based service
#   (app, horizon, reverb, scheduler) points at the SAME repo and the SAME
#   docker/Dockerfile.app, differing only in each App's "Start Command"
#   override (php-fpm / horizon / reverb:start / schedule:work — see the
#   `command:` line for each service below for the exact command to use).
#   This is more moving parts to keep in sync than Option A — pick ONE
#   approach and stay consistent to avoid the kind of file-drift issues
#   we already hit earlier in this project.
# ═════════════════════════════════════════════════════════════════════════

services:

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - WA_SERVICE_URL=http://wa-service:3000
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    networks: [wg_net]
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.easypanel.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage/app:ro
    depends_on: [app]
    networks: [wg_net]

  wa-service:
    build:
      context: ./wa-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - LARAVEL_WEBHOOK_URL=http://app/internal/wa-events
      - LARAVEL_SECRET=${WA_SERVICE_SECRET}
      - SESSION_STORE=local
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - wa_sessions:/app/sessions
      - wa_logs:/app/src/logs
    networks: [wg_net]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',{headers:{'x-wg-secret':process.env.LARAVEL_SECRET}},(r)=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=C --lc-ctype=C
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [wg_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    networks: [wg_net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  horizon:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    restart: unless-stopped
    command: php artisan horizon
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
    volumes:
      - app_logs:/var/www/html/storage/logs
    networks: [wg_net]

  reverb:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    # No exposed port — nginx proxies WebSocket upgrades to this container
    # internally via the /app/ location block in nginx.easypanel.conf.
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
    networks: [wg_net]

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    restart: unless-stopped
    command: php artisan schedule:work
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
    networks: [wg_net]

volumes:
  pg_data:
  redis_data:
  wa_sessions:
  wa_logs:
  app_storage:
  app_logs:

networks:
  wg_net:
    driver: bridge
