services:

  # ── PHP Application ─────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: wg_app
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    env_file: .env
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - WA_SERVICE_URL=http://wa-service:3000
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    networks: [wg_net]
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Nginx ────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: wg_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - app_storage:/var/www/html/storage/app:ro
    depends_on: [app]
    networks: [wg_net]

  # ── WhatsApp Node.js Service ─────────────────────────────────────────────────
  wa-service:
    build:
      context: ./wa-service
      dockerfile: Dockerfile
    container_name: wg_wa_service
    restart: unless-stopped
    environment:
      - PORT=3000
      - LARAVEL_WEBHOOK_URL=http://app/internal/wa-events
      - LARAVEL_SECRET=${WA_SERVICE_SECRET}
      - SESSION_STORE=local
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - wa_sessions:/app/sessions
      - wa_logs:/app/src/logs
    networks: [wg_net]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',{headers:{'x-wg-secret':process.env.LARAVEL_SECRET}},(r)=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: wg_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=C --lc-ctype=C
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [wg_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wg_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    networks: [wg_net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ── Horizon (Queue Workers) ──────────────────────────────────────────────────
  horizon:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: wg_horizon
    restart: unless-stopped
    command: php artisan horizon
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    env_file: .env
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
    volumes:
      - app_logs:/var/www/html/storage/logs
    networks: [wg_net]

  # ── Reverb (WebSocket) ───────────────────────────────────────────────────────
  reverb:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: wg_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    # No host port binding — nginx proxies WebSocket upgrades to this
    # container internally via the /app/ location block in nginx.conf,
    # so Reverb rides over the same domain/port as everything else.
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    env_file: .env
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
    networks: [wg_net]

  # ── Scheduler ────────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: wg_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    env_file: .env
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
    networks: [wg_net]

volumes:
  pg_data:      { driver: local }
  redis_data:   { driver: local }
  wa_sessions:  { driver: local }
  wa_logs:      { driver: local }
  app_storage:  { driver: local }
  app_logs:     { driver: local }

networks:
  wg_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
