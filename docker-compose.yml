# ═════════════════════════════════════════════════════════════════════════
# Default compose — single all-in-one container (EasyPanel / Coolify / PaaS)
# ═════════════════════════════════════════════════════════════════════════
# PHP-FPM + Nginx + Reverb + Horizon + Scheduler + wa-service, managed by
# Supervisor. Traefik terminates TLS at the edge and forwards plain HTTP
# to this service on port 80.
#
# Platforms that auto-detect "docker-compose.yml" MUST get this file.
# The FPM-only image (docker/Dockerfile.app, php-fpm as PID 1 on :9000)
# is killed by Traefik after ~3s because nothing answers HTTP on :80.
#
# Classic multi-container VPS deploy: docker-compose.vps.yml + deploy.sh
# ═════════════════════════════════════════════════════════════════════════

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    expose:
      - "80"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      LOG_CHANNEL: stderr

      APP_NAME: ${APP_NAME:-WaGateway}
      APP_URL: ${APP_URL}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb

      REVERB_HOST: 0.0.0.0
      REVERB_PORT: "8080"
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}

      WA_SERVICE_URL: http://127.0.0.1:3000
      WA_SERVICE_SECRET: ${WA_SERVICE_SECRET}

      ADMIN_EMAILS: ${ADMIN_EMAILS}

      CHARGILY_MODE: ${CHARGILY_MODE:-test}
      CHARGILY_API_KEY: ${CHARGILY_API_KEY}
      CHARGILY_WEBHOOK_SECRET: ${CHARGILY_WEBHOOK_SECRET}

    volumes:
      - app_storage:/var/www/html/storage/app
      - wa_sessions:/var/www/html/wa-service/sessions

    networks:
      - wg_net

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s


  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"

    volumes:
      - pg_data:/var/lib/postgresql/data

    networks:
      - wg_net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  redis:
    image: redis:7-alpine

    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "60 1000"
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    networks:
      - wg_net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}


volumes:

  pg_data:
    driver: local

  redis_data:
    driver: local

  wa_sessions:
    driver: local

  app_storage:
    driver: local


networks:

  wg_net:
    driver: bridge
