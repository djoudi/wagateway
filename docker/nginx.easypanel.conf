# ─────────────────────────────────────────────────────────────────────────
# EasyPanel variant — plain HTTP only.
#
# EasyPanel's built-in Traefik proxy terminates SSL at the edge (via Let's
# Encrypt, configured in the EasyPanel UI when you attach a domain to the
# nginx service) and forwards plain HTTP to this container. Do NOT add an
# HTTPS server block or an HTTP→HTTPS redirect here — Traefik already
# talks to us over HTTP internally, and a redirect would create a loop
# (Traefik → nginx redirects to https → Traefik's internal connection is
# http-only → loop).
#
# Functionally identical to docker/nginx.coolify.conf — EasyPanel and
# Coolify both terminate TLS at an edge Traefik proxy and forward plain
# HTTP internally, so the same nginx config serves both. Kept as a
# separate file (not a symlink) so each deployment target's compose file
# can reference its own conf explicitly, avoiding the exact kind of
# drift/confusion that caused earlier deployment issues in this project.
#
# For a standalone deployment WITHOUT any PaaS (manual SSL certs), use
# docker/nginx.conf instead — that one does its own SSL termination.
# ─────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 50M;

    # Coolify's Traefik already terminates TLS — these headers tell Laravel
    # the original request was HTTPS so it generates https:// URLs, secure
    # cookies, etc. correctly despite receiving plain HTTP internally.
    set $forwarded_proto "https";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/internal/ {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\.(env|git|htaccess) { deny all; return 404; }
    location ~ ^/(storage|bootstrap/cache) { deny all; return 404; }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass   app:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param  HTTPS on;
        fastcgi_param  HTTP_X_FORWARDED_PROTO $forwarded_proto;
        include        fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Laravel Reverb — WebSocket upgrade, proxied to the reverb container
    # over the same domain/port instead of exposing 8080 publicly.
    # Matches Reverb's default path (config/reverb.php `path` option).
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400; # keep long-lived WS connections open
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
