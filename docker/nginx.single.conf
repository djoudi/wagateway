# ─────────────────────────────────────────────────────────────────────────
# Single-container nginx config — PHP-FPM, Reverb (WebSocket) and wa-service
# all run inside the same container. Traefik (EasyPanel/Coolify) terminates
# TLS at the edge and forwards plain HTTP internally — no HTTPS block here.
# ─────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 50M;

    # Edge proxy terminates TLS — tell Laravel the original request was HTTPS.
    set $forwarded_proto "https";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # wa-service webhook callback (Node → Laravel, same container).
    location ~ ^/internal/ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel Reverb — WebSocket upgrade, proxied locally.
    # Dashboard routes live under /dashboard, so /app/ is free for Reverb.
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400;
    }

    location ~ /\.(env|git|htaccess) { deny all; return 404; }
    location ~ ^/(storage|bootstrap/cache) { deny all; return 404; }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param  HTTPS on;
        fastcgi_param  HTTP_X_FORWARDED_PROTO $forwarded_proto;
        include        fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
