; WaGateway php-fpm pool. Named [www] so it replaces the image default
; rather than running alongside zz-docker.conf's leftover [www] stanza.
[www]
user = wagateway
group = wagateway
; 9000 on all interfaces: nginx in this container (127.0.0.1:9000) and
; nginx in a sibling container (app:9000) can both reach workers.
listen = 9000
listen.owner = wagateway
listen.group = wagateway
listen.mode = 0660
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
