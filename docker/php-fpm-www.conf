; WaGateway php-fpm pool — runs workers as wagateway to match file ownership.
[wagateway]
user = wagateway
group = wagateway
listen = 127.0.0.1:9000
listen.owner = wagateway
listen.group = wagateway
listen.mode = 0660
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
