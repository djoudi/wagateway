[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/php-fpm.out.log
stderr_logfile=/var/log/supervisor/php-fpm.err.log
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/nginx.out.log
stderr_logfile=/var/log/supervisor/nginx.err.log
redirect_stderr=true

[program:reverb]
command=/usr/local/bin/run-artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/html
autostart=true
autorestart=true
startsecs=2
startretries=20
priority=40
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/reverb.out.log
stderr_logfile=/var/log/supervisor/reverb.err.log
redirect_stderr=true

[program:horizon]
command=/usr/local/bin/run-artisan horizon
directory=/var/www/html
autostart=true
autorestart=true
startsecs=2
startretries=20
priority=40
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/horizon.out.log
stderr_logfile=/var/log/supervisor/horizon.err.log
redirect_stderr=true

[program:scheduler]
command=/usr/local/bin/run-artisan schedule:work
directory=/var/www/html
autostart=true
autorestart=true
startsecs=2
startretries=20
priority=40
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/scheduler.out.log
stderr_logfile=/var/log/supervisor/scheduler.err.log
redirect_stderr=true

[program:wa-service]
command=/usr/local/bin/run-wa-service
directory=/var/www/html/wa-service
autostart=true
autorestart=true
startsecs=2
startretries=20
priority=40
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/wa-service.out.log
stderr_logfile=/var/log/supervisor/wa-service.err.log
redirect_stderr=true
